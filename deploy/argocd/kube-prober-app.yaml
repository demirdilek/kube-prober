apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prober
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/demirdilek/kube-prober.git'
    targetRevision: HEAD
    path: 'helm/kube-prober'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true