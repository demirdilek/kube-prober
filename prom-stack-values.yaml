# ==============================================================================
# Prometheus Stack Local Configuration (Google SRE Best Practices)
# Dynamic Multi-Target Support, Anti-Alert-Fatigue & Actionable Notifications
# ==============================================================================

alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
      - alertmanager-webhooks

  config:
    global:
      resolve_timeout: 5m

    # --------------------------------------------------------------------------
    # Routing Tree
    # --------------------------------------------------------------------------
    route:
      # Default fall-through route for unclassified alerts
      receiver: 'slack-warnings'
      group_by: ['alertname', 'severity', 'category']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h

      routes:
        # Silence noisy Kubernetes internal watchdog
        - matchers:
            - alertname = Watchdog
          receiver: 'null'

        # Critical alerts route to dedicated high-urgency receivers
        - matchers:
            - severity = critical
          receiver: 'slack-critical'

        # Warnings and info alerts route to silent audit receiver
        - matchers:
            - severity =~ "info|warning"
          receiver: 'slack-warnings'

    # --------------------------------------------------------------------------
    # Receivers Configuration
    # --------------------------------------------------------------------------
    receivers:
      - name: 'null'

      # ------------------------------------------------------------------------
      # Slack: Critical Receiver (Pings <!channel> for immediate response)
      # ------------------------------------------------------------------------
      - name: 'slack-critical'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-webhooks/slack-critical
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🚨 [FIRING: {{ .CommonLabels.severity | toUpper }}]{{ else }}✅[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
            text: >-
              <!channel>
              {{ range .Alerts }}
              *Time:* {{ .StartsAt.Format "15:04:05 MST" }}
              {{ if .Annotations.summary }}*Summary:* {{ .Annotations.summary }}{{ end }}
              {{ if $.CommonLabels.category }}*Category:* `{{ $.CommonLabels.category }}`{{ end }}
              {{ if .Annotations.hint }}
              *Hint:* > {{ .Annotations.hint }}
              {{ end }}
              ---
              {{ end }}

      # ------------------------------------------------------------------------
      # Slack: Warning Receiver (No channel ping - silent audit log)
      # ------------------------------------------------------------------------
      - name: 'slack-warnings'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-webhooks/slack-warnings
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🚨 [FIRING: {{ .CommonLabels.severity | toUpper }}]{{ else }}✅ [RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
              *Time:* {{ .StartsAt.Format "15:04:05 MST" }}
              {{ if .Annotations.summary }}*Summary:* {{ .Annotations.summary }}{{ end }}
              {{ if $.CommonLabels.category }}*Category:* `{{ $.CommonLabels.category }}`{{ end }}
              {{ if .Annotations.hint }}
              *Hint:* > {{ .Annotations.hint }}
              {{ end }}
              ---
              {{ end }}

      # ------------------------------------------------------------------------
      # Enterprise Paging Integrations (Commented out for future scaling)
      # ------------------------------------------------------------------------

      # -- PagerDuty (Standard Enterprise Escalation) --
      # - name: 'pagerduty-critical'
      #   pagerduty_configs:
      #     - routing_key_file: /etc/alertmanager/secrets/alertmanager-webhooks/pagerduty-routing-key
      #       send_resolved: true
      #       severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
      #       description: '{{ .CommonLabels.alertname }} - {{ .CommonLabels.category }}'

      # -- Opsgenie (Atlassian Incident Management) --
      # - name: 'opsgenie-critical'
      #   opsgenie_configs:
      #     - api_key_file: /etc/alertmanager/secrets/alertmanager-webhooks/opsgenie-api-key
      #       send_resolved: true
      #       priority: 'P1'
      #       message: '[{{ .CommonLabels.severity | toUpper }}] {{ .CommonLabels.alertname }}'
      #       description: '{{ range .Alerts }}{{ .Annotations.summary }}\nHint: {{ .Annotations.hint }}{{ end }}'

      # -- Pushover (Lightweight Push Notifications) --
      # - name: 'pushover-critical'
      #   pushover_configs:
      #     - user_key_file: /etc/alertmanager/secrets/alertmanager-webhooks/pushover-user
      #       token_file: /etc/alertmanager/secrets/alertmanager-webhooks/pushover-token
      #       priority: '1' # Bypasses silent mode during critical system failures
      #       sound: 'alien'
      #       send_resolved: true
      #       title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
      #       message: '{{ range .Alerts }}{{ .Annotations.summary }}\nHint: {{ .Annotations.hint }}{{ end }}'

# ------------------------------------------------------------------------------
# Grafana Configuration (Default Home Dashboard & Provisioning)
# ------------------------------------------------------------------------------
grafana:
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/kube_prober_dashboard.json

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

# Disable control plane components for k3s/k3d compatibility
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
nodeExporter:
  enabled: false